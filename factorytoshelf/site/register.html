<div class="container" id="regForm">

    <!-- 工厂注册 -->

        <div class="f-group">
          <label>工厂所在地 <span class="req">*</span></label>
          <input type="text" name="country" placeholder="如：广东佛山 / 浙江宁波" required maxlength="40">

      <div class="f-group">
        <label>主营品类（可多选）<span class="req">*</span></label>
        <div class="f-check">
          <label><input type="checkbox" name="categories" value="家具">家具</label>
          <label><input type="checkbox" name="categories" value="户外">户外庭院</label>
          <label><input type="checkbox" name="categories" value="健身">健身运动</label>
          <label><input type="checkbox" name="categories" value="厨卫">厨卫</label>
          <label><input type="checkbox" name="categories" value="照明">照明</label>
          <label><input type="checkbox" name="categories" value="汽配">汽配</label>
          <label><input type="checkbox" name="categories" value="宠物">宠物</label>
          <label><input type="checkbox" name="categories" value="玩具">玩具</label>
        </div>
      </div>
      <div class="f-group">
        <label>合作模式 <span class="req">*</span></label>
        <div class="f-check">
          <label><input type="radio" name="model" value="OEM" checked>OEM 代工</label>
          <label><input type="radio" name="model" value="ODM">ODM 贴牌</label>
          <label><input type="radio" name="model" value="OBM">OBM 自有品牌</label>
        </div>
      </div>
      <div class="f-row">
        <div class="f-group">
          <label>工厂规模</label>
          <select name="size">

            <option value="50人以下">50 人以下</option>

            <option value="200-500人">200-500 人</option>
            <option value="500人以上">500 人以上</option>

        </div>
        <div class="f-group">
          <label>目标渠道（可多选）</label>
          <div class="f-check">
            <label><input type="checkbox" name="channels" value="Home Depot">Home Depot</label>
            <label><input type="checkbox" name="channels" value="Wayfair">Wayfair</label>
            <label><input type="checkbox" name="channels" value="Target">Target</label>
            <label><input type="checkbox" name="channels" value="Amazon">Amazon</label>
            <label><input type="checkbox" name="channels" value="Costco">Costco</label>
            <label><input type="checkbox" name="channels" value="其他">其他</label>

        </div>
      </div>
      <div class="f-group">
        <label>工厂简介 / 优势（选填）</label>
        <textarea name="note" placeholder="认证资质（BSCI/ISO/UL…）、主打产品、出口经验、代表客户…" maxlength="400"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%">提交注册 · 免费建档</button>

      <div class="f-row">

        <div class="f-check">

          <label><input type="checkbox" name="categories" value="厨卫">厨卫</label>
          <label><input type="checkbox" name="categories" value="照明">照明</label>
          <label><input type="checkbox" name="categories" value="汽配">汽配</label>

        <div class="reg-benefit">✓ 海外仓快速索样</div>
        <div class="reg-benefit">✓ AI 买手社媒分析</div>

      <div class="form-msg" id="msgBuyer"></div>
    </form>

</div>

<script>
(function () {
  // Tab 切换（支持 ?tab=buyer）
  var tabs = document.querySelectorAll(".reg-tab");
  function show(tab) {
    tabs.forEach(function (t) { t.classList.toggle("active", t.getAttribute("data-tab") === tab); });
    document.getElementById("formSupplier").style.display = tab === "supplier" ? "" : "none";
    document.getElementById("formBuyer").style.display = tab === "buyer" ? "" : "none";
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { show(t.getAttribute("data-tab")); }); });
  var q = new URLSearchParams(location.search).get("tab");
  if (q === "buyer") show("buyer");

  function collect(form, role) {
    var f = new FormData(form);
    var getChecks = function (name) {
      return Array.prototype.map.call(form.querySelectorAll('[name="' + name + '"]:checked'), function (c) { return c.value; }).join("、");
    };
    var data = {
      role: role,
      email: f.get("email") || "",
      password: f.get("password") || "",
      name: (f.get("firstName") || "") + " " + (f.get("lastName") || ""),
      company: f.get("company") || "",
      phone: f.get("phone") || "",
      country: f.get("country") || "",
      categories: getChecks("categories"),
      channels: getChecks("channels"),
      note: f.get("note") || "",
    };
    if (role === "supplier") {
      var model = form.querySelector('[name="model"]:checked');
      data.model = model ? model.value : "OEM";
      data.size = f.get("size") || "";
    }
    return data;
  }

  function submit(form, role, msgEl) {
    fetch("/api/register", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(collect(form, role)),
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        msgEl.className = "form-msg show " + (res.ok ? "ok" : "err");
        msgEl.textContent = res.ok ? "✓ " + res.message + "（注册编号 #" + res.id + "）" : res.error || "提交失败，请稍后再试";
        if (res.ok) form.reset();
      })
      .catch(function () {
        msgEl.className = "form-msg show err";
        msgEl.textContent = "网络异常，请稍后再试";
      });
  }

  document.getElementById("formSupplier").addEventListener("submit", function (e) {
    e.preventDefault();
    submit(this, "supplier", document.getElementById("msgSupplier"));
  });
  document.getElementById("formBuyer").addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = this.querySelector('[name="password"]').value;
    var pw2 = this.querySelector('[name="password2"]').value;
    var msg = document.getElementById("msgBuyer");
    if (pw !== pw2) {
      msg.className = "form-msg show err";
      msg.textContent = "两次输入的密码不一致";
      return;
    }
    submit(this, "buyer", msg);
  });
})();
</script>
